<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>客家選情 3D 地圖</title>
<style>
  :root{
    --bg:#f6f1e7; --paper:#fffdf8; --ink:#14243f; --indigo:#1d3b6e; --vermilion:#d8412f; --gold:#f2b632;
    --muted:#7a7262; --line:#e3dac6; --panel-w:380px;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* 載入遮罩 */
  #veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);transition:opacity .8s}
  #veil.off{opacity:0;pointer-events:none}
  #veil b{font:900 22px var(--serif);letter-spacing:.2em;color:var(--indigo)}

  /* 左上標題 */
  #hud{position:fixed;top:18px;left:20px;z-index:10;pointer-events:none;max-width:min(440px,calc(100vw - 40px))}
  #hud .kicker{font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--vermilion)}
  #hud h1{margin:2px 0 4px;font:900 clamp(24px,3.4vw,34px)/1.2 var(--serif);color:var(--ink)}
  #hud p{margin:0;font-size:13px;color:var(--muted)}
  .legend{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .legend i{width:22px;height:9px;border-radius:2px}
  .legend i:nth-child(2){background:#f3e58a}.legend i:nth-child(3){background:#f3a72a}.legend i:nth-child(4){background:#f05a45}
  .legend i:nth-child(5){background:#9a231f}.legend i:nth-child(6){background:#8b2fa6}
  body.panel-open .legend{display:none}

  /* 縣市快速切換 */
  #chips{position:fixed;left:20px;bottom:18px;z-index:10;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,calc(100vw - 40px));transition:opacity .3s}
  #chips button{border:1px solid var(--line);background:rgba(255,253,248,.88);backdrop-filter:blur(6px);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
  #chips button:hover{border-color:var(--indigo)}
  #chips button.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

  /* 返回總覽 */
  /* 地圖上的浮動指標切換（聚焦縣市時出現） */
  #float-metric{position:fixed;z-index:12;left:50%;bottom:104px;transform:translate(-50%,12px);display:flex;align-items:center;gap:8px;
    padding:6px 8px 6px 14px;border-radius:999px;background:rgba(20,36,63,.92);color:#fff;box-shadow:0 10px 26px rgba(20,36,63,.3);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  #float-metric.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #float-metric .fl{font-size:13px;font-weight:700;color:#c9d3e6;white-space:nowrap}
  #float-metric .seg{background:rgba(255,255,255,.14)}
  #float-metric .seg button{color:#dbe3f2;padding:5px 14px;font-size:13.5px}
  #float-metric .seg button.on{background:var(--gold);color:var(--ink)}
  body.panel-open #float-metric{left:calc((100vw - var(--panel-w) - 32px) / 2)}
  #back{position:fixed;top:18px;right:20px;z-index:12;border:0;border-radius:999px;padding:8px 16px;background:var(--ink);color:#fff;font-weight:700;
    box-shadow:0 6px 18px rgba(20,36,63,.25);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.3s}
  #back.on{opacity:1;transform:none;pointer-events:auto}
  body.panel-open #back{right:calc(var(--panel-w) + 36px)}

  /* 標籤層 */
  #labels{position:fixed;inset:0;z-index:5;pointer-events:none}
  .lb{position:absolute;left:0;top:0;white-space:nowrap;transform:translate(-50%,-50%);will-change:transform;transition:opacity .35s}
  .lb.county{font:900 14px var(--serif);color:var(--ink);text-shadow:0 0 4px var(--paper),0 0 4px var(--paper),0 0 8px var(--paper)}
  .lb.town{font:700 11px var(--sans);color:var(--ink);background:rgba(255,253,248,.82);padding:0 6px;border-radius:6px;line-height:18px}
  .lb.town.sel{background:var(--vermilion);color:#fff}
  .lb.hide,.lb.clash{opacity:0}

  /* 縣市面板 */
  #panel{position:fixed;z-index:20;top:16px;right:16px;bottom:16px;width:var(--panel-w);display:flex;flex-direction:column;
    background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(20,36,63,.18);overflow:hidden;
    transform:translateX(calc(100% + 30px));transition:transform .55s cubic-bezier(.2,.9,.25,1)}
  body.panel-open #panel{transform:none}
  .p-head{position:relative;padding:16px 18px 14px;background:linear-gradient(135deg,var(--ink),var(--indigo));color:#fff;display:flex;align-items:center;gap:12px}
  .p-head .stamp{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:900 19px var(--serif);transform:rotate(-10deg)}
  .p-head h2{margin:0;font:900 26px/1.1 var(--serif)}
  .p-head small{display:block;color:#b9c6e0;font-size:12px;letter-spacing:.1em;margin-top:3px}
  .p-close{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:17px}
  .p-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .p-stats div{background:var(--paper);padding:10px 18px}
  .p-stats span{font-size:12px;color:var(--muted)}
  .p-stats b{display:block;font:900 22px/1.25 var(--serif);font-variant-numeric:tabular-nums}
  .p-stats .hl b{color:var(--vermilion)}
  .p-body{flex:1;overflow:auto;padding:14px 18px 18px}
  .p-sub{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin:0 0 8px}
  .seg{display:inline-flex;background:#efe7d4;border-radius:999px;padding:2px}
  .seg button{border:0;background:none;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--indigo);color:#fff}
  .towns{list-style:none;margin:0;padding:0}
  .towns li button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:76px 1fr 66px;gap:10px;align-items:center;width:100%;padding:5px 6px;border-radius:8px;font-size:13px}
  .towns li button:hover,.towns li button.on{background:#f1ead9}
  .towns li button.on{box-shadow:inset 3px 0 0 var(--vermilion)}
  .towns .bar{height:9px;border-radius:5px;background:#ebe3cf;overflow:hidden}
  .towns .bar i{display:block;height:100%;border-radius:5px}
  .towns b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .towns b small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);line-height:1.1}
  .towns li.few button{opacity:.6}
  .towns li.few b small{font-size:11px}
  .p-note{margin-top:14px;font-size:12px;color:var(--muted)}
  .p-note em{font-style:normal;background:#fff3cf;color:#7a5b00;padding:1px 8px;border-radius:999px;margin-right:6px}

  /* 候選人（佔位） */
  .p-sec{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin:18px 0 8px;padding-top:14px;border-top:1px dashed #d7ccae}
  .p-sec small{font-weight:500;font-size:12px;color:var(--muted)}
  .ph{display:inline-block;font-size:11px;font-weight:700;color:#7a5b00;background:#fff3cf;padding:0 7px;border-radius:999px;vertical-align:1px}
  .cands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cand{--cc:#1f7a8c;border:2px solid color-mix(in srgb,var(--cc) 55%,transparent);border-radius:12px;background:#f7f2e5;padding-bottom:10px;text-align:center;overflow:hidden}
  .cand .art{background:color-mix(in srgb,var(--cc) 16%,var(--paper));aspect-ratio:1/0.9;display:grid;place-items:end center;position:relative}
  .cand .art svg,.cand .art img{width:76%;height:auto;display:block}
  .cand .art img{object-fit:cover}
  .cand .art .ph{position:absolute;top:8px;left:8px}
  .cand .nm{font:900 17px/1.2 var(--serif);margin-top:8px}
  .cand .party{display:inline-block;margin:4px 0;font-size:11.5px;font-weight:700;color:#fff;background:var(--cc);padding:1px 10px;border-radius:999px}
  .cand .age{font-size:12.5px;color:var(--muted)}
  .cand ul{list-style:none;margin:6px 10px 0;padding:6px 0 0;border-top:1px dashed #d7ccae;text-align:left;font-size:12.5px;line-height:1.5}
  .cand li{padding-left:11px;position:relative}
  .cand li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--cc)}
  .policies{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .policy{--cc:#1f7a8c;background:#f7f2e5;border-radius:12px;padding:10px 12px 12px;border-top:4px solid var(--cc);display:flex;flex-direction:column;gap:6px}
  .policy b{font-size:14px;color:var(--cc)}
  .policy p{margin:0;font-size:13px;line-height:1.6;color:var(--text)}
  .policy .more{margin-top:auto;align-self:flex-start;font-size:12.5px;font-weight:700;color:#fff;background:var(--cc);padding:4px 12px;border-radius:999px}
  .stat-ph b{color:var(--muted);font-weight:500;font-size:15px;font-family:var(--sans);padding-top:4px}

  .grab{display:none}
  /* hover 提示 */
  #tip{position:fixed;z-index:25;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.5;padding:6px 10px;border-radius:8px;
    transform:translate(14px,14px);opacity:0;transition:opacity .12s}
  #tip.on{opacity:1}

  @media (max-width:760px){
    :root{--panel-w:100vw}
    /* 底部抽屜：半屏（預設）⇄ 全屏，拖曳把手或標題列切換 */
    :root{--sheet-half:60vh;--sheet-full:92vh}
    /* 抽屜用「高度」切換而非位移：半屏時可捲動範圍＝看得到的範圍，內容不會藏在螢幕外 */
    #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:var(--sheet-half);border-radius:20px 20px 0 0;
      transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1),height .35s cubic-bezier(.2,.9,.25,1)}
    body.panel-open #panel{transform:translateY(0)}
    body.panel-open #panel.full{height:var(--sheet-full)}
    #panel.dragging{transition:none}
    .grab{display:block;position:absolute;left:50%;top:6px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(255,255,255,.55)}
    .p-head{padding-top:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
    #panel.full .p-head{border-radius:0}
    .p-body{overscroll-behavior:contain}
    body.panel-open #back{right:20px}
    body.panel-open #float-metric{left:50%;bottom:calc(var(--sheet-half) + 12px)}
    body.sheet-full #float-metric{opacity:0;pointer-events:none}   /* 抽屜拉到全屏時地圖被蓋住，浮動按鈕一起藏 */
    #chips{display:none}
    body.panel-open #hud p,body.panel-open #hud .kicker{display:none}
    body.panel-open #hud h1{font-size:20px}
    .p-stats{grid-template-columns:repeat(4,1fr)}
    .p-stats div{padding:6px 8px 6px 10px}
    .p-stats span{font-size:10.5px}
    .p-stats b{font-size:15px}
    .stat-ph b{font-size:13px}
    .p-head{padding:14px 14px 10px}
    .p-head h2{font-size:21px}
    .p-head .stamp{width:32px;height:32px;font-size:15px}
    .p-body{padding:10px 14px 16px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "camera-controls": "./lib/camera-controls.module.js"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="veil"><b>載入地圖中…</b></div>
<div id="labels"></div>

<header id="hud">
  <div class="kicker">2026 地方選舉 · 客家選情</div>
  <h1>客家選情 3D 地圖</h1>
  <p>點選縣市：鏡頭飛入、縣市升起、鄉鎮依數據起伏。拖曳旋轉、滾輪縮放。</p>
  <div class="legend" aria-label="客家比例色階"><span>客家比例 低</span><i></i><i></i><i></i><i></i><i></i><span>高</span></div>
</header>

<nav id="chips" aria-label="縣市快速切換"></nav>
<button id="back" type="button">← 回到全臺</button>
<div id="float-metric" aria-label="鄉鎮起伏與顏色依據"><span class="fl">鄉鎮依據</span>
  <span class="seg"><button data-m="pct" class="on">客家比例</button><button data-m="hakka">客家人口</button></span></div>

<aside id="panel" aria-live="polite">
  <div class="p-head"><span class="grab" aria-hidden="true"></span>
    <div class="stamp">選</div>
    <div><h2 id="p-name">—</h2><small id="p-sub">客家人口檔案</small></div>
    <button class="p-close" id="p-close" aria-label="關閉面板">✕</button>
  </div>
  <div class="p-stats">
    <div><span>設籍人口</span><b id="p-total">—</b></div>
    <div><span>客家人口</span><b id="p-hakka">—</b></div>
    <div class="hl"><span>客家比例</span><b id="p-pct">—</b></div>
    <div id="p-votes-cell"><span>選票數</span><b id="p-votes">—</b></div>
  </div>
  <div class="p-body">
    <div class="p-sec" style="border:0;padding-top:0;margin-top:2px">兩黨主要候選人 <small><span class="ph">佔位</span></small></div>
    <div class="cands" id="p-cands"></div>
    <div class="p-sec" style="border:0;padding-top:0;margin-top:12px">客家政見</div>
    <div class="policies" id="p-policies"></div>

    <div class="p-sec"><span>鄉鎮起伏依據 <small id="p-count" style="font-weight:500;color:var(--muted)"></small></span>
      <span class="seg" id="metric-seg">
        <button data-m="pct" class="on">客家比例</button><button data-m="hakka">客家人口</button>
      </span>
    </div>
    <ol class="towns" id="p-towns"></ol>

    <div class="p-note"><em>資料說明</em>人口與客家人口來自全國客家人口暨語言基礎資料調查。選票數、候選人與政策為佔位版面，待客戶提供後替換。</div>
  </div>
</aside>
<div id="tip"></div>

<!-- d3-geo 依賴 d3-array，順序不可對調 -->
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/gsap.min.js"></script>
<script src="data/hakka.js"></script>
<script src="data/election.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
