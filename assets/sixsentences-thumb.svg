  <text x="120" y="850" font-family="'Noto Sans TC',sans-serif" font-size="44" fill="#fff7ec" fill-opacity="0.9" letter-spacing="6">逐日換一種腔調 · 聽一句 · 揀一句 · 拼一句</text>
