      <stop offset="0.32" stop-color="#c8743a" stop-opacity="0.22"/>
      <stop offset="0.72" stop-color="#13161a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b0d10" stop-opacity="0"/>
