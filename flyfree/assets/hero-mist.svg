<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2630"/>
      <stop offset="0.48" stop-color="#11161b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="dawn" cx="50%" cy="78%" r="58%">
      <stop offset="0" stop-color="#e6b070" stop-opacity="0.36"/>
      <stop offset="0.42" stop-color="#c8743a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c8743a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="4" seed="23" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.24"/>
      </feComponentTransfer>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#dawn)"/>
  <g filter="url(#blur)" opacity="0.72">
    <ellipse cx="410" cy="725" rx="520" ry="138" fill="#b9c8d2" opacity="0.18"/>
    <ellipse cx="1180" cy="770" rx="700" ry="170" fill="#d8d1c4" opacity="0.13"/>
    <ellipse cx="820" cy="900" rx="840" ry="126" fill="#e6b070" opacity="0.10"/>
    <ellipse cx="1530" cy="610" rx="440" ry="120" fill="#9fb5c5" opacity="0.12"/>
  </g>
  <rect width="1920" height="1080" filter="url(#softNoise)" opacity="0.72"/>
  <path d="M0 860 C260 780 520 920 780 810 C1050 696 1290 800 1510 720 C1690 654 1810 700 1920 654 L1920 1080 L0 1080 Z" fill="#0b0d10" opacity="0.34"/>
